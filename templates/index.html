<!DOCTYPE html>
<html>
<head>
    <title>Om's Infinite Free AI Image Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="stars"></div>

<div class="container">
    <h1>Om's Infinite Free AI Image Generator</h1>

    <form method="POST" onsubmit="showLoader()">
        <input type="text" name="prompt" placeholder="Enter your cosmic prompt..." required>
        <button type="submit">Generate</button>
    </form>

    <div id="loader" class="loader hidden"></div>
</div>

<script>
function showLoader() {
    document.getElementById("loader").classList.remove("hidden");
}
</script>

</body>
</html>
